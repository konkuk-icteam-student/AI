name: chatbot-production

services:
  api:
    image: "${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-chatbot}"
      OLLAMA_BASE_URL: "http://ollama:11434"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      - "${DOCUMENTS_PATH:-../../storage/prod/documents}:/app/documents:ro"
      - "${PROMPTS_PATH:-../../resources/prompts}:/app/resources/prompts:ro"
      - "${SEARCH_CONFIG_PATH:-../../resources/search}:/app/resources/search:ro"
      - model-cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-chatbot}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-models:
    image: ollama/ollama:0.11.10
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull ${EMBEDDING_MODEL:-qwen3-embedding:0.6b} &&
        ollama pull ${LLM_MODEL:-qwen3:8b}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  ollama-data:
  model-cache:
