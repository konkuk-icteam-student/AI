name: chatbot-production

services:
  api:
    image: "${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@127.0.0.1:${POSTGRES_PORT:-25433}/${POSTGRES_DB:-chatbot}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "${API_BIND_ADDRESS:-127.0.0.1}"
      - --port
      - "${API_PORT:-8000}"
    volumes:
      - "${DOCUMENTS_PATH:-../../storage/prod/documents}:/app/documents:ro,Z"
      - "${PROMPTS_PATH:-../../resources/prompts}:/app/resources/prompts:ro,Z"
      - "${SEARCH_CONFIG_PATH:-../../resources/search}:/app/resources/search:ro,Z"
      - model-cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-25433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-chatbot}"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  model-cache:
