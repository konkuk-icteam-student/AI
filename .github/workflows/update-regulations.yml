name: Update Regulation PDFs

on:
  # Actions 페이지에서 수동 실행
  workflow_dispatch:

  # 하루 한 번 자동 확인
  schedule:
    # UTC 18:00
    # 한국시간 03:00
    - cron: "0 18 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.PR_AUTOMATION_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download regulations to documents/text_pdf
        run: |
          python scripts/update_regulations.py

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- documents/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Changed regulation PDFs:"
          git status --short -- documents/

      - name: Commit and push update branch
        if: steps.changes.outputs.changed == 'true'
        id: commit
        env:
          UPDATE_BRANCH: automation/regulation-update-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add documents/
          git commit -m "chore: update regulation PDFs"
          git push --set-upstream origin "$UPDATE_BRANCH"
          echo "branch=$UPDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request to develop
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
        run: >-
          gh pr create
          --base develop
          --head "$UPDATE_BRANCH"
          --title "chore: update regulation PDFs"
          --body "자동 수집된 규정집 변경입니다. CI와 변경 목록을 확인한 뒤 develop에 병합해 주세요."
