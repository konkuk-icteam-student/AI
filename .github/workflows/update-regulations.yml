name: Update Regulation PDFs

on:
  # Actions 페이지에서 수동 실행
  workflow_dispatch:

  # 하루 한 번 자동 확인
  schedule:
    # UTC 18:00
    # 한국시간 03:00
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download regulations to documents/text_pdf
        run: |
          python scripts/update_regulations.py

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- documents/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Changed regulation PDFs:"
          git status --short -- documents/

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add documents/

          git commit -m "chore: update regulation PDFs"

      - name: Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin main

