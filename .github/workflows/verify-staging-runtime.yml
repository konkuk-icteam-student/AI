name: Verify staging runtime

on:
  push:
    branches: [ops/staging-pdfs]
    paths: [.github/workflows/verify-staging-runtime.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PDF extraction and model runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
    steps:
      - name: Check deployed staging without changing the database
        shell: bash
        run: |
          set -euo pipefail

          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_HOST_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing repository secret: ${variable}" >&2
              exit 1
            fi
          done

          ssh_port="${DEPLOY_PORT:-22}"
          if [[ ! "${DEPLOY_HOST}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
              || [[ ! "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] \
              || [[ ! "${ssh_port}" =~ ^[0-9]{1,5}$ ]] \
              || (( 10#${ssh_port} < 1 || 10#${ssh_port} > 65535 )); then
            echo "Invalid deployment host, user, or port." >&2
            exit 1
          fi
          ssh_port="$((10#${ssh_port}))"

          umask 077
          chatbot_ssh_dir="$(mktemp -d "${RUNNER_TEMP}/chatbot-ssh.XXXXXX")"
          trap 'rm -f "${chatbot_ssh_dir}/id_ed25519" "${chatbot_ssh_dir}/known_hosts"; rmdir "${chatbot_ssh_dir}"' EXIT

          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${chatbot_ssh_dir}/id_ed25519"
          chmod 600 "${chatbot_ssh_dir}/id_ed25519"
          ssh-keygen -y -P '' -f "${chatbot_ssh_dir}/id_ed25519" > /dev/null

          if (( 10#${ssh_port} == 22 )); then
            printf '%s %s\n' "${DEPLOY_HOST}" "${DEPLOY_HOST_KEY}" > "${chatbot_ssh_dir}/known_hosts"
          else
            printf '[%s]:%s %s\n' "${DEPLOY_HOST}" "${ssh_port}" "${DEPLOY_HOST_KEY}" > "${chatbot_ssh_dir}/known_hosts"
          fi
          ssh-keygen -l -f "${chatbot_ssh_dir}/known_hosts" > /dev/null

          ssh \
            -p "${ssh_port}" \
            -i "${chatbot_ssh_dir}/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o "UserKnownHostsFile=${chatbot_ssh_dir}/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          source_sha=f3923681f14f0ed7292f98607e05630b3b5de9a4
          api=chatbot-staging-api-1
          test "$(docker inspect --format '{{.Config.Image}}' "${api}")" = "ghcr.io/konkuk-icteam-student/ai:${source_sha}"
          cd /opt/chatbot-service/storage/staging/documents
          sha256sum --quiet -c "/opt/chatbot-service/imports/staging/${source_sha}/SHA256SUMS"
          # Temporary diagnostic override; image HOME will be fixed before indexing.
          docker exec -e HOME=/home/app -i "${api}" python - <<'PYTHON'
          import json
          from pathlib import Path
          from time import monotonic
          from urllib.parse import urlparse
          from app.core.config import DATABASE_URL, EMBEDDING_DIM
          from app.infrastructure.database import get_conn

          database = urlparse(DATABASE_URL)
          assert database.hostname == "127.0.0.1" and database.port == 15433 and database.path == "/chatbot"
          with get_conn() as connection, connection.cursor() as cursor:
              counts = {}
              for table in ["regulation_chunks", "faq_chunks", "phone_contacts"]:
                  cursor.execute(f"SELECT count(*) FROM {table}")
                  counts[table] = cursor.fetchone()[0]
          print("Staging data counts:", json.dumps(counts))
          for directory, expected in [("text_pdf", 371), ("image_pdf", 2)]:
              files = list((Path("/app/documents") / directory).glob("*.pdf"))
              assert len(files) == expected, (directory, len(files))
              print(f"PDF input count: {directory}={len(files)}")

          from app.ingestion.service import check_ollama, embed_texts
          check_ollama()
          started = monotonic()
          vectors = embed_texts(["정보보호위원회의 심의 사항을 확인합니다."])
          assert len(vectors) == 1 and len(vectors[0]) == EMBEDDING_DIM
          print(f"Embedding runtime verified: dimensions={len(vectors[0])}, seconds={monotonic()-started:.2f}")

          import pymupdf
          from app.ingestion.parser import extract_page_text
          text_pdf = sorted(Path("/app/documents/text_pdf").glob("*.pdf"))[0]
          with pymupdf.open(text_pdf) as document:
              text, mode = extract_page_text(document[0], "text")
          assert text and mode == "text"
          print(f"Direct PDF extraction verified: characters={len(text)}")

          image_pdf = sorted(Path("/app/documents/image_pdf").glob("*.pdf"))[0]
          print("Starting OCR runtime check (model downloads may be required).")
          started = monotonic()
          with pymupdf.open(image_pdf) as document:
              text, mode = extract_page_text(document[0], "ocr")
          assert text and mode == "ocr"
          print(f"OCR extraction verified: characters={len(text)}, seconds={monotonic()-started:.2f}")
          PYTHON
          OLLAMA_HOST=http://127.0.0.1:11434 ollama ps
          nvidia-smi --query-gpu=name,memory.used,utilization.gpu --format=csv
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18000/health
          echo
          REMOTE
